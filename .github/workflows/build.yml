name: QuickWeb Wear OS APK release

on:
  push:
    branches: [main]
    paths:
      - "QuickWeb-Watch-Source-QuickSwipe.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quickweb-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Wear OS ARMv7 APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Extract project source
        run: |
          set -euo pipefail
          test -s QuickWeb-Watch-Source-QuickSwipe.zip
          mkdir source
          unzip -q QuickWeb-Watch-Source-QuickSwipe.zip -d source
          test -s source/app/build.gradle
          test -s source/app/src/main/java/com/mika/quickweb/MainActivity.java
          test -s source/gradlew
          test -s source/gradle/wrapper/gradle-wrapper.jar

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK API 37 extension 2
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.2 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Validate persistent release signing key
        env:
          KEYSTORE_B64: ${{ secrets.QUICKWEB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.QUICKWEB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QUICKWEB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QUICKWEB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=("QUICKWEB_KEYSTORE_BASE64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("QUICKWEB_KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("QUICKWEB_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("QUICKWEB_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing repository secret(s): %s\n' "${missing[*]}"
            echo "Add the four QUICKWEB signing secrets under Settings > Secrets and variables > Actions."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/quickweb-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "QUICKWEB_KEYSTORE_PATH=$KEYSTORE"
            echo "QUICKWEB_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "QUICKWEB_KEY_ALIAS=$KEY_ALIAS"
            echo "QUICKWEB_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug and signed release APKs
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Verify APK architecture and signatures
        working-directory: source
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            test -s "$APK"
            unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/.*\.so$'
            if unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
              echo "::error::Unexpected ARM64 library in ARMv7-only APK"
              exit 1
            fi
            "$APKSIGNER" verify --verbose "$APK"
          done
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      # APKs are attached directly to the GitHub Release. No Actions artifacts are stored.
      - name: Publish APKs as GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quickweb-watch-latest
          target_commitish: main
          name: QuickWeb Wear OS APK
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Wear OS release — ARMv7 (armeabi-v7a) only.
            Includes a verified debug APK and a persistently signed release APK.
            APKs are published directly as release assets; Actions artifacts are not used.
          files: |
            source/app/build/outputs/apk/debug/app-debug.apk
            source/app/build/outputs/apk/release/app-release.apk
