name: QuickWeb Wear OS Debug APK

on:
  push:
    branches: [main]
    paths:
      - "QuickWeb-Watch-Source-QuickSwipe.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quickweb-debug-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          set -euo pipefail
          test -s QuickWeb-Watch-Source-QuickSwipe.zip
          mkdir source
          unzip -q QuickWeb-Watch-Source-QuickSwipe.zip -d source
          test -s source/app/build.gradle
          test -s source/app/src/main/java/com/mika/quickweb/MainActivity.java
          test -s source/gradlew
          test -s source/gradle/wrapper/gradle-wrapper.jar

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.2 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build debug APK
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify debug APK
        working-directory: source
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/.*\.so$'
          if unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "::error::Unexpected ARM64 library in ARMv7-only APK"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"

      # No upload-artifact step: publish the APK directly as a GitHub Release asset.
      - name: Publish debug APK as GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quickweb-debug-${{ github.run_number }}
          target_commitish: main
          name: QuickWeb Wear OS Debug APK (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body: |
            Automatically built QuickWeb Wear OS debug APK.
            Architecture: ARMv7 (armeabi-v7a).
            Signed with the standard Android debug key.
            Published directly as a GitHub Release asset; Actions artifact storage is not used.
          files: source/app/build/outputs/apk/debug/app-debug.apk
