name: QuickWeb Wear OS Debug APK

on:
  push:
    branches: [main]
    paths:
      - "QuickWeb-Watch.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quickweb-debug-release
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          set -euo pipefail
          ZIP="QuickWeb-Watch.zip"
          test -s "$ZIP"
          mkdir source
          unzip -q "$ZIP" -d source
          if [ ! -f source/app/build.gradle ]; then
            PROJECT_DIR="$(find source -mindepth 2 -maxdepth 4 -type f -path '*/app/build.gradle' -print -quit | xargs -r dirname | xargs -r dirname)"
            test -n "$PROJECT_DIR"
            cp -a "$PROJECT_DIR"/. source/
          fi
          test -s source/app/build.gradle
          test -s source/app/src/main/java/com/mika/quickweb/MainActivity.java
          test -s source/gradlew
          test -s source/gradle/wrapper/gradle-wrapper.jar

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # Android 17 is published as android-37.0 (not android-37).
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          # AGP resolves compileSdk 37 as android-37; provide the expected alias.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Build debug APK
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify debug APK
        working-directory: source
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/.*\.so$'
          if unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "::error::Unexpected ARM64 library in ARMv7-only APK"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"

      - name: Publish debug APK as GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quickweb-debug-${{ github.run_number }}
          target_commitish: main
          name: QuickWeb Wear OS Debug APK (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body: |
            Automatically built QuickWeb Wear OS debug APK.
            Architecture: ARMv7 (armeabi-v7a).
            Signed with the standard Android debug key.
            Published directly as a GitHub Release asset; Actions artifact storage is not used.
          files: source/app/build/outputs/apk/debug/app-debug.apk
